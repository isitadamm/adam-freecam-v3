name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: find
        run: |
          GRADLEW=$(find . -name gradlew -not -path "./.git/*" | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No gradlew found anywhere in the repo"
            find . -not -path "./.git/*" | head -n 50
            exit 1
          fi
          DIR=$(dirname "$GRADLEW" | sed 's|^\./||')
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: adam-camera-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
